<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">OpsAtlas</title>
  <desc id="desc">A dark operations dashboard banner with a fictional fleet map and incident status cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061019"/>
      <stop offset=".55" stop-color="#0a1b29"/>
      <stop offset="1" stop-color="#102b38"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#91b5c9" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <g transform="translate(64 62)" font-family="Inter,Segoe UI,Arial,sans-serif">
