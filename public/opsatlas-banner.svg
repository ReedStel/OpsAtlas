    <text x="132" y="65" fill="#f2f7fa" font-size="60" font-weight="750" letter-spacing="-2">OpsAtlas</text>
    <text x="134" y="104" fill="#9ab5c7" font-size="21">Privacy-first fleet health and incident command</text>
    <g transform="translate(134 137)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
